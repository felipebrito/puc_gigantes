<svg width="400" height="800" viewBox="0 0 400 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dim Background -->
  <mask id="face-hole">
    <rect x="-200" y="-200" width="800" height="1200" fill="white"/>
    <!-- Large Cutout Head -->
    <ellipse cx="200" cy="380" rx="125" ry="170" fill="black"/>
  </mask>
  
  <rect x="-200" y="-200" width="800" height="1200" fill="black" fill-opacity="0.6" mask="url(#face-hole)"/>
  
  <!-- Dotted Outline Guide -->
  <ellipse cx="200" cy="380" rx="125" ry="170" stroke="white" stroke-width="5" stroke-dasharray="10 10"/>
  
  <!-- Text Guide -->
  <text x="200" y="80" text-anchor="middle" fill="white" font-family="sans-serif" font-size="22" font-weight="bold" letter-spacing="1">ENCAIXE O ROSTO</text>
</svg>
